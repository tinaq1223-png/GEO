        ];

        let countryData = [];
        const formatNum = (num) => new Intl.NumberFormat('en-US').format(num);

        // 載入與初始化數據 (先嘗試連線 API，被阻擋時無縫使用完整聯合國數據庫)
        async function initData() {
            const badge = document.getElementById('status-badge');

            try {
                // 超時保護 (3秒)
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);

                const [rcRes, wbRes] = await Promise.all([
                    fetch('https://restcountries.com/v3.1/all?fields=name,cca3,region,population,area,translations', { signal: controller.signal }),
                    fetch('https://api.worldbank.org/v2/country/all/indicator/NY.GDP.PCAP.CD?format=json&per_page=300&mrv=1', { signal: controller.signal })
                ]);

                clearTimeout(timeoutId);

                if (!rcRes.ok) throw new Error("API 被阻擋");

                const rcData = await rcRes.json();
                const wbRaw = await wbRes.json();
                const wbData = wbRaw[1] || [];

                const gdpMap = {};
                wbData.forEach(item => {
                    if (item.country && item.country.id) gdpMap[item.country.id] = item.value;
                });

                const regionMap = { "Asia": "亞洲", "Europe": "歐洲", "Americas": "美洲", "Africa": "非洲", "Oceania": "大洋洲" };

                countryData = rcData.map(item => {
                    const iso = item.cca3;
                    let gdp = gdpMap[iso] || 0;
                    if (iso === 'TWN' && !gdp) gdp = 34400;

                    return {
                        iso: iso,
                        nameTW: item.translations?.zho?.common || item.name.common,
                        nameEN: item.name.common,
                        region: regionMap[item.region] || item.region || "其他",
                        gdpPerCapita: Math.round(gdp),
                        population: item.population || 0,
                        areaSqKm: item.area || 0,
                        flag: iso.toLowerCase().slice(0, 2)
                    };
                });

                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> 雲端 API 即時連線 (${countryData.length} 國)`;

            } catch (err) {
                // 若本機檔 (file://) 被 CORS 阻擋，自動使用完整內建聯合國數據庫
                countryData = fullUNCountryData;
                badge.className = "text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full border border-indigo-200 flex items-center gap-2 font-medium";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-indigo-500"></span> 內建全球標準資料庫 (${countryData.length} 國)`;
            }

            renderTable();
        }

        // 渲染表格內容
        function renderTable() {
            const searchKeyword = document.getElementById('search-input').value.toLowerCase().trim();
            const selectedRegion = document.getElementById('region-filter').value;
            const sortMode = document.getElementById('sort-select').value;

            // 數據過濾
            let filtered = countryData.filter(c => {
                const matchesKeyword = c.nameTW.toLowerCase().includes(searchKeyword) || 
                                       c.nameEN.toLowerCase().includes(searchKeyword) || 
                                       c.iso.toLowerCase().includes(searchKeyword);
                const matchesRegion = (selectedRegion === 'ALL') || (c.region === selectedRegion);
                return matchesKeyword && matchesRegion;
            });

            // 數據排序
            filtered.sort((a, b) => {
                if (sortMode === 'gdp-desc') return b.gdpPerCapita - a.gdpPerCapita;
                if (sortMode === 'gdp-asc') return a.gdpPerCapita - b.gdpPerCapita;
                if (sortMode === 'pop-desc') return b.population - a.population;
                if (sortMode === 'area-desc') return b.areaSqKm - a.areaSqKm;
                return 0;
            });

            // 渲染至 HTML
            const tbody = document.getElementById('country-table-body');
            tbody.innerHTML = '';

            filtered.forEach(item => {
                const density = item.areaSqKm > 0 ? (item.population / item.areaSqKm).toFixed(1) : 0;
                const flagUrl = `https://flagcdn.com/w40/${item.flag}.png`;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-indigo-50/40 transition-colors';
                tr.innerHTML = `
                    <td class="p-4 font-medium text-slate-900 flex items-center gap-3">
                        <img src="${flagUrl}" class="w-6 h-4 object-cover rounded shadow-sm border border-slate-200" 
                             onerror="this.src='https://via.placeholder.com/24x16?text=?'" alt="flag">
                        <span class="text-xs bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-mono border border-slate-200">${item.iso}</span>
                        <span class="font-semibold">${item.nameTW}</span>
                        <span class="text-xs text-slate-400 hidden sm:inline">(${item.nameEN})</span>
                    </td>
                    <td class="p-4"><span class="bg-slate-100 text-slate-600 border border-slate-200 px-2.5 py-0.5 rounded-full text-xs font-medium">${item.region}</span></td>
                    <td class="p-4 text-right font-mono font-semibold text-indigo-600">${item.gdpPerCapita > 0 ? '$' + formatNum(item.gdpPerCapita) : '<span class="text-slate-300">--</span>'}</td>
                    <td class="p-4 text-right font-mono text-slate-700">${formatNum(item.population)}</td>
                    <td class="p-4 text-right font-mono text-slate-600">${formatNum(item.areaSqKm)}</td>
                    <td class="p-4 text-right font-mono text-slate-600">${formatNum(density)}</td>
                `;
                tbody.appendChild(tr);
            });

            // 更新頁面統計
            document.getElementById('stat-count').innerText = filtered.length;
            
            const gdpList = filtered.filter(c => c.gdpPerCapita > 0);
            const avgGdp = gdpList.length ? Math.round(gdpList.reduce((sum, c) => sum + c.gdpPerCapita, 0) / gdpList.length) : 0;
            document.getElementById('stat-avg-gdp').innerText = '$' + formatNum(avgGdp);

            const totalPop = filtered.reduce((sum, c) => sum + c.population, 0);
            document.getElementById('stat-total-pop').innerText = formatNum(totalPop) + ' 人';
        }

        // 事件綁定
        document.getElementById('search-input').addEventListener('input', renderTable);
        document.getElementById('region-filter').addEventListener('change', renderTable);
        document.getElementById('sort-select').addEventListener('change', renderTable);

        // 初始化執行
        initData();
    </script>
</body>
</html>
